serverAddr = "{{ .Envs.FRP_SERVER_ADDR }}"
serverPort = {{ .Envs.FRP_SERVER_PORT }}
transport.protocol = "{{ .Envs.FRP_TRANSPORT_PROTOCOL }}"

[[proxies]]
name = "http"
type = "tcp"
localIP = "{{ .Envs.PROXIES_HTTP_LOCAL_IP }}"
localPort = 80
remotePort = {{ .Envs.PROXIES_HTTP_REMOTE_PORT }}

[[proxies]]
name = "https"
type = "tcp"
localIP = "{{ .Envs.PROXIES_HTTPS_LOCAL_IP }}"
localPort = 443
remotePort = {{ .Envs.PROXIES_HTTPS_REMOTE_PORT }}