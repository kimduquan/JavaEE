services:
  wiredoor-cli:
    image: wiredoor/wiredoor-cli:latest
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    ports:
      - "${GATEWAY_IP}:${FRP_BIND_PORT}:${FRP_BIND_PORT}/tcp"
      - "${GATEWAY_IP}:${FRP_KCP_BIND_PORT}:${FRP_KCP_BIND_PORT}/udp"
      - "${GATEWAY_IP}:${FRP_QUIC_BIND_PORT}:${FRP_QUIC_BIND_PORT}/udp"
      - "${GATEWAY_IP}:${FRP_TCP_MUX_HTTP_CONNECT_PORT}:${FRP_TCP_MUX_HTTP_CONNECT_PORT}/tcp"
    environment:
      WIREDOOR_URL: ${WIREDOOR_URL}
      TOKEN: ${WIREDOOR_GATEWAY_TOKEN}
    networks:
      - wiredoor-cli

networks:
  wiredoor-cli:
    driver: bridge