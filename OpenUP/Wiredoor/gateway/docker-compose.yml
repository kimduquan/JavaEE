services:
  wiredoor-gateway:
    image: wiredoor/wiredoor-cli:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    ports:
      - "7000:7000/tcp"
      - "7000:7000/udp"
      - "7002:7002/udp"
      - "1337:1337/tcp"
    environment:
      WIREDOOR_URL: ${WIREDOOR_URL}
      TOKEN: ${WIREDOOR_GATEWAY_TOKEN}
    networks:
      - wiredoor-gateway

networks:
  wiredoor-gateway:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.50.0/24