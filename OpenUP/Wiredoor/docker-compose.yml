services:
  frps:
    image: ghcr.io/fatedier/frps:v0.71.1
    container_name: frps
    restart: unless-stopped
    volumes:
      - ./frps.toml:/etc/frps/frps.toml
    environment:
      FRP_BIND_PORT: ${FRP_BIND_PORT}
      FRP_KCP_BIND_PORT: ${FRP_KCP_BIND_PORT}
      FRP_QUIC_BIND_PORT: ${FRP_QUIC_BIND_PORT}
      FRP_TCP_MUX_HTTP_CONNECT_PORT: ${FRP_TCP_MUX_HTTP_CONNECT_PORT}
    network_mode: "container:wiredoor"
    command: ["-c", "/etc/frps/frps.toml"]
