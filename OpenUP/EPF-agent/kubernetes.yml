---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: epf-agent
    app.kubernetes.io/version: 1.0.0
  name: epf-agent
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: epf-agent
    app.kubernetes.io/version: 1.0.0
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: epf-agent
    app.kubernetes.io/version: 1.0.0
  name: epf-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: epf-agent
      app.kubernetes.io/version: 1.0.0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epf-agent
        app.kubernetes.io/version: 1.0.0
    spec:
      containers:
        - env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm
                  key: VLLM_API_KEY
            - name: MODEL_NAME
              value: "neuralmagic/granite-3.1-8b-instruct-quantized.w4a16"
            - name: MODEL_BASE_URL
              value: "http://vllm.default.svc.cluster.local:8000/v1"
            - name: MCP_SERVER_URL
              value: "http://epf-mcp-gateway.default.svc.cluster.local:9197/mcp"
            - name: SESSION_TTL
              value: "600"
            - name: REDIS_HOST
              value: "redis-master.default.svc.cluster.local"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: redis-password
            - name: JWT_VERIFY_PUBLICKEY_LOCATION
              value: "https://chipmunk-capable-prawn.ngrok-free.app/auth/realms/EPF-dev/protocol/openid-connect/certs"
            - name: JWT_VERIFY_ISSUER
              value: "https://chipmunk-capable-prawn.ngrok-free.app/auth/realms/EPF-dev"
          image: epf-agent:1.0.0
          imagePullPolicy: IfNotPresent
          name: epf-agent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: 150m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 128Mi
