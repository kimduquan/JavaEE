---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: epf-agent
    app.kubernetes.io/version: 1.0.0
  name: epf-agent
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: epf-agent
    app.kubernetes.io/version: 1.0.0
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: epf-agent
    app.kubernetes.io/version: 1.0.0
  name: epf-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: epf-agent
      app.kubernetes.io/version: 1.0.0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epf-agent
        app.kubernetes.io/version: 1.0.0
    spec:
      containers:
        - env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: epf-agent
                  key: MODEL_API_KEY
            - name: MODEL
              value: "neuralmagic/Mistral-7B-Instruct-v0.3-GPTQ-4bit"
            - name: MODEL_BASE_URL
              value: "vllm.default.svc.cluster.local:8000/v1"
          image: epf-agent:1.0.0
          imagePullPolicy: IfNotPresent
          name: epf-agent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: 150m
              memory: 192Mi
            requests:
              cpu: 25m
              memory: 128Mi
