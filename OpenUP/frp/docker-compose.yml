services:
  frps:
    image: localhost:32000/epf/frps:1.0.0
    container_name: frps
    restart: unless-stopped
    ports:
      - "10.0.0.1:7000:7000/tcp"
      - "10.0.0.1:7000:7000/udp"
    networks:
      - wiredoor_frps

networks:
  wiredoor_frps:
    name: docker-setup_wiredoor
    external: true
