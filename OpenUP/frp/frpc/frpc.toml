serverAddr = "{{ .Envs.FRP_SERVER_ADDR }}"
serverPort = {{ .Envs.FRP_SERVER_PORT }}
transport.protocol = "{{ .Envs.FRP_TRANSPORT_PROTOCOL }}"
includes = ["/config/*.toml"]

[[proxies]]
name = "{{ .Envs.FRP_PROXIES_HTTP_NAME }}"
type = "tcp"
localIP = "{{ .Envs.FRP_PROXIES_HTTP_LOCAL_IP }}"
localPort = 80
remotePort = {{ .Envs.FRP_PROXIES_HTTP_REMOTE_PORT }}
loadBalancer.group = "{{ .Envs.FRP_PROXIES_HTTP_LOAD_BALANCER_GROUP }}"
loadBalancer.groupKey = "{{ .Envs.FRP_PROXIES_HTTP_LOAD_BALANCER_KEY }}"

[[proxies]]
name = "{{ .Envs.FRP_PROXIES_HTTPS_NAME }}"
type = "tcp"
localIP = "{{ .Envs.FRP_PROXIES_HTTPS_LOCAL_IP }}"
localPort = 443
remotePort = {{ .Envs.FRP_PROXIES_HTTPS_REMOTE_PORT }}
loadBalancer.group = "{{ .Envs.FRP_PROXIES_HTTPS_LOAD_BALANCER_GROUP }}"
loadBalancer.groupKey = "{{ .Envs.FRP_PROXIES_HTTPS_LOAD_BALANCER_KEY }}"