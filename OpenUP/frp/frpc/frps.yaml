apiVersion: v1
kind: Service
metadata:
  name: frps
spec:
  type: ClusterIP
  ports:
    - name: bind-port
      protocol: TCP
      port: 7000
      targetPort: $FRP_BIND_PORT
    - name: kcp-bind-port
      protocol: UDP
      port: 7000
      targetPort: $FRP_KCP_BIND_PORT
    - name: quic-bind-port
      protocol: UDP
      port: 7002
      targetPort: $FRP_QUIC_BIND_PORT
    - name: tcpmux-http-connect-port
      protocol: TCP
      port: 1337
      targetPort: $FRP_TCP_MUX_HTTP_CONNECT_PORT
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: frps-slice-1
  labels:
    kubernetes.io/service-name: frps
addressType: IPv4
ports:
  - name: bind-port
    protocol: TCP
    port: 7000
  - name: kcp-bind-port
    protocol: UDP
    port: 7000
  - name: quic-bind-port
    protocol: UDP
    port: 7002
  - name: tcpmux-http-connect-port
    protocol: TCP
    port: 1337
endpoints:
  - addresses:
      - "$GATEWAY_IP"
    conditions:
      ready: true
