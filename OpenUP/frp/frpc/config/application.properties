quarkus.container-image.image=ghcr.io/fatedier/frpc:v0.71.1
quarkus.kubernetes.name=frpc
quarkus.kubernetes.image-pull-policy=if-not-present
quarkus.helm.name=frpc
quarkus.kubernetes.mounts.frpc-config.path=/config
quarkus.kubernetes.config-map-volumes.frpc-config.config-map-name=frpc
quarkus.kubernetes.arguments=-c,/config/frpc
#quarkus.kubernetes.deployment-kind=Job
quarkus.kubernetes.env.vars.FRP_SERVER_ADDR=
quarkus.kubernetes.env.vars.FRP_SERVER_PORT=7002
quarkus.kubernetes.env.vars.FRP_TRANSPORT_PROTOCOL=quic
quarkus.kubernetes.env.vars.PROXIES_HTTP_LOCAL_IP=
quarkus.kubernetes.env.vars.PROXIES_HTTP_REMOTE_PORT=8080
quarkus.kubernetes.env.vars.PROXIES_HTTPS_LOCAL_IP=
quarkus.kubernetes.env.vars.PROXIES_HTTPS_REMOTE_PORT=8443