---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: frp-tls
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: frp-tls
  namespace: default
spec:
  ca:
    secretName: frp-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frp-tls
  namespace: default
spec:
  isCA: true
  commonName: supavisor
  dnsNames:
    - "frp.default.svc.cluster.local"
    - "frp"
    - "*.localhost.direct"
  secretName: frp-tls
  issuerRef:
    name: frp-tls
    kind: ClusterIssuer
    group: cert-manager.io
---