quarkus.container-image.group=epf
quarkus.container-image.name=epf-management
quarkus.kubernetes.name=epf-management
quarkus.http.port=9196
quarkus.jib.ports=9196
quarkus.kubernetes.image-pull-policy=if-not-present
quarkus.kubernetes.ports."http".container-port=9196
quarkus.kubernetes.ports."http".host-port=9196
#quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".level=TRACE
#quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".min-level=TRACE
#quarkus.kubernetes.resources.requests.cpu=50m
#quarkus.kubernetes.resources.requests.memory=128Mi
