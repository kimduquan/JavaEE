quarkus.kubernetes.env.vars.MP_JWT_VERIFY_PUBLICKEY_LOCATION=https://chipmunk-capable-prawn.ngrok-free.app/auth/realms/EPF-dev/protocol/openid-connect/certs
quarkus.kubernetes.env.vars.MP_JWT_VERIFY_ISSUER=https://chipmunk-capable-prawn.ngrok-free.app/auth/realms/EPF-dev
quarkus.helm.name=epf-management
quarkus.cache.redis.hosts=redis://090323508@redis-master.default.svc.cluster.local:6379
quarkus.cache.redis.epf-management-organization.value-type=epf.management.schema.Organization
quarkus.cache.redis.epf-management-organization.expire-after-write=24h
quarkus.cache.redis.epf-management-organization.use-optimistic-locking=true
quarkus.rest-client.epf-management-auth.url=https://keycloak.default.svc.cluster.local/auth/realms/master/protocol/openid-connect
quarkus.rest-client.epf-management-admin.url=https://keycloak.default.svc.cluster.local/auth/admin/realms/EPF-dev
quarkus.tls.tls-disabled.trust-all=true
quarkus.tls.tls-disabled.hostname-verification-algorithm=NONE
quarkus.rest-client.epf-management-auth.tls-configuration-name=tls-disabled
quarkus.rest-client.epf-management-admin.tls-configuration-name=tls-disabled
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://postgresql.default.svc.cluster.local:5432/postgres
quarkus.datasource.username=postgres
quarkus.datasource.password=090323508