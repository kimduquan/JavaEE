apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: epf-cluster
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 10.243.0.0/16
    serviceDomain: cluster.local
    services:
      cidrBlocks:
      - 10.95.0.0/16
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: K0smotronControlPlane
    name: epf-cluster-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: KubevirtCluster
    name: epf-cluster
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtCluster
metadata:
  name: epf-cluster
  annotations:
    cluster.x-k8s.io/managed-by: k0smotron
spec:
  controlPlaneServiceTemplate:
    spec:
      type: LoadBalancer
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: K0smotronControlPlane
metadata:
  name: epf-cluster-control-plane
spec:
  version: v1.34.1-k0s.0
  persistence:
    type: emptyDir
  service:
    type: LoadBalancer
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: epf-cluster-md-0
spec:
  template:
    spec:
      virtualMachineBootstrapCheck:
        checkStrategy: ssh
      virtualMachineTemplate:
        spec:
          dataVolumeTemplates:
          - metadata:
              name: epf-cluster-boot-volume
            spec:
              pvc:
                accessModes:
                - ReadWriteMany
                resources:
                  requests:
                    storage: 20Gi
                storageClassName: ceph-rbd
                volumeMode: Block
              source:
                pvc:
                  name: ubuntu-2404-container-disk
          runStrategy: Always
          template:
            metadata:
              annotations:
                descheduler.alpha.kubernetes.io/request-evict-only: ""
                kubevirt.io/allow-pod-bridge-network-live-migration: "true"
            spec:
              domain:
                cpu:
                  cores: 2
                devices:
                  disks:
                  - disk:
                      bus: virtio
                    name: dv-volume
                  networkInterfaceMultiqueue: true
                memory:
                  guest: 2560Mi
              evictionStrategy: LiveMigrate
              nodeSelector:
                node-role.kubernetes.io/worker: ""
              volumes:
              - dataVolume:
                  name: epf-cluster-boot-volume
                name: dv-volume
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: K0sWorkerConfigTemplate
metadata:
  name: epf-cluster-md-0
spec:
  template:
    spec: {}
      # More details of the worker configuration can be set here
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: epf-cluster-md-0
  annotations:
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "5"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "0"
    capacity.cluster-autoscaler.kubernetes.io/memory: "2560Mi"
    capacity.cluster-autoscaler.kubernetes.io/cpu: "2"
    capacity.cluster-autoscaler.kubernetes.io/ephemeral-disk: "20Gi"
spec:
  clusterName: epf-cluster
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: epf-cluster
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: epf-cluster
    spec:
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: K0sWorkerConfigTemplate
          name: epf-cluster-md-0
      clusterName: epf-cluster
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: KubevirtMachineTemplate
        name: epf-cluster-md-0
      version: v1.34.1+k0s.0
