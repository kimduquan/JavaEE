---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: epf-agent
    app.kubernetes.io/version: 1.0.0
  name: epf-agent
spec:
  ports:
    - name: http
      port: 8123
      protocol: TCP
      targetPort: 8123
  selector:
    app.kubernetes.io/name: epf-agent
    app.kubernetes.io/version: 1.0.0
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: epf-agent
    app.kubernetes.io/version: 1.0.0
  name: epf-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/version: 1.0.0
      app.kubernetes.io/name: epf-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/version: 1.0.0
        app.kubernetes.io/name: epf-agent
    spec:
      containers:
        - env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPENAI_MODEL
              value: neuralmagic/granite-3.1-8b-instruct-quantized.w4a16
            - name: OPENAI_BASE_URL
              value: http://vllm:8000/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: VLLM_API_KEY
                  name: vllm
            - name: MCP_SERVER_URL
              value: http://epf-mcp-gateway:9197/mcp
            - name: MCP_SERVER_URL_FORMAT
              value: "http://epf-mcp-gateway:9197/{name}/mcp"
            - name: JWT_KEY_URL
              value: "https://chipmunk-capable-prawn.ngrok-free.app/auth/realms/EPF-dev/protocol/openid-connect/certs"
            - name: MODEL_CALL_THREAD_LIMIT
              value: "10"
            - name: MODEL_CALL_RUN_LIMIT
              value: "5"
            - name: TOOL_CALL_THREAD_LIMIT
              value: "10"
            - name: TOOL_CALL_RUN_LIMIT
              value: "5"
          image: docker.io/epf-agent
          imagePullPolicy: IfNotPresent
          name: epf-agent
          ports:
            - containerPort: 8123
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 128Mi