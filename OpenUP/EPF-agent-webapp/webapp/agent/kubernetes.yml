---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: epf-agent
    app.kubernetes.io/version: 1.0.0
  name: epf-agent
spec:
  ports:
    - name: http
      port: 8123
      protocol: TCP
      targetPort: 8123
  selector:
    app.kubernetes.io/name: epf-agent
    app.kubernetes.io/version: 1.0.0
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: epf-agent
    app.kubernetes.io/version: 1.0.0
  name: epf-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/version: 1.0.0
      app.kubernetes.io/name: epf-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/version: 1.0.0
        app.kubernetes.io/name: epf-agent
    spec:
      containers:
        - env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: docker.io/epf-agent
          imagePullPolicy: IfNotPresent
          name: epf-agent
          ports:
            - containerPort: 8123
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 128Mi