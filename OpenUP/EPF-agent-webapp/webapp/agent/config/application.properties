quarkus.container-image.group=epf
quarkus.container-image.name=epf-agent
quarkus.kubernetes.name=epf-agent
quarkus.http.port=8123
quarkus.jib.ports=8123
quarkus.kubernetes.image-pull-policy=if-not-present
quarkus.kubernetes.ports."http".container-port=8123
quarkus.kubernetes.ports."http".host-port=8123
quarkus.kubernetes.resources.requests.cpu=25m
quarkus.kubernetes.resources.requests.memory=128Mi
quarkus.kubernetes.resources.limits.cpu=150m
quarkus.kubernetes.resources.limits.memory=192Mi
quarkus.helm.name=epf-agent
quarkus.kubernetes.env.vars.OPENAI_MODEL=neuralmagic/granite-3.1-8b-instruct-quantized.w4a16
quarkus.kubernetes.env.vars.OPENAI_BASE_URL=http://vllm:8000/v1
quarkus.kubernetes.env.mapping.OPENAI_API_KEY.from-secret=vllm
quarkus.kubernetes.env.mapping.OPENAI_API_KEY.with-key=VLLM_API_KEY
quarkus.kubernetes.env.vars.MCP_SERVER_URL=http://epf-mcp-gateway:9197/mcp
quarkus.kubernetes.env.vars.MCP_SERVER_URL_FORMAT=http://epf-mcp-gateway:9197/{}/mcp
quarkus.kubernetes.env.vars.JWT_KEY_URL=https://chipmunk-capable-prawn.ngrok-free.app/auth/realms/EPF-dev/protocol/openid-connect/certs
quarkus.kubernetes.env.vars.JWT_ISSUER=https://chipmunk-capable-prawn.ngrok-free.app/auth/realms/EPF-dev
quarkus.kubernetes.env.vars.MODEL_CALL_THREAD_LIMIT=10
quarkus.kubernetes.env.vars.MODEL_CALL_RUN_LIMIT=5
quarkus.kubernetes.env.vars.TOOL_CALL_THREAD_LIMIT=10
quarkus.kubernetes.env.vars.TOOL_CALL_RUN_LIMIT=5
quarkus.kubernetes.env.vars.DEBUG=true