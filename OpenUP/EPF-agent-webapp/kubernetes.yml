---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: epf-agent-webapp
    app.kubernetes.io/version: 1.0.0
  name: epf-agent-webapp
spec:
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app.kubernetes.io/name: epf-agent-webapp
    app.kubernetes.io/version: 1.0.0
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: epf-agent-webapp
    app.kubernetes.io/version: 1.0.0
  name: epf-agent-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/version: 1.0.0
      app.kubernetes.io/name: epf-agent-webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/version: 1.0.0
        app.kubernetes.io/name: epf-agent-webapp
    spec:
      containers:
        - env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: OIDC_CLIENT_ID
                  name: oidc
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: OIDC_CLIENT_SECRET
                  name: oidc
            - name: ISSUER
              value: https://chipmunk-capable-prawn.ngrok-free.app/auth/realms/EPF-dev
            - name: NEXTAUTH_URL
              value: http://gateway.docker.internal/agent/webapp
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  key: NEXTAUTH_SECRET
                  name: nextauth
            - name: LANGGRAPH_DEPLOYMENT_URL
              value: http://epf-agent.default.svc.cluster.local:8123
          image: docker.io/epf-agent-webapp
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 10
          name: epf-agent-webapp
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 128Mi
          startupProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/name: epf-agent-webapp
    app.kubernetes.io/version: 1.0.0
  name: epf-agent-webapp
spec:
  ingressClassName: nginx
  rules:
    - host: touching-pika-enabled.ngrok-free.app
      http:
        paths:
          - backend:
              service:
                name: epf-agent-webapp
                port:
                  name: http
            path: /
            pathType: Prefix
