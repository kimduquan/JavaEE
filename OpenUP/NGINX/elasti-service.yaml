apiVersion: elasti.truefoundry.com/v1alpha1
kind: ElastiService
metadata:
  name: nginx
spec:
  service: nginx
  minTargetReplicas: 1
  scaleTargetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: nginx
  triggers:
    - type: prometheus
      metadata:
        query: "sum(rate(envoy_cluster_external_upstream_rq{envoy_cluster_name='default/cilium-gateway-epf-gateway/default_nginx_80'}[1m])) or vector(0)"
        serverAddress: "http://prometheus-server.prometheus.svc.cluster.local:9090"
        threshold: "0.01"
        uptimeFilter: "job='prometheus'"
  autoscaler:
    name: nginx
    type: keda
  probeResponse:
    - method: GET
      path:
        type: Exact
        value: /healthz
      response:
        status: 200
        body: 'OK'
