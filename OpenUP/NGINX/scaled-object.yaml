apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: nginx
spec:
  scaleTargetRef:
    name: nginx
  minReplicaCount: 1
  maxReplicaCount: 3
  triggers:
    - type: prometheus
      metadata:
        serverAddress: "http://prometheus-server.prometheus.svc.cluster.local:9090"
        query: "sum(rate(envoy_cluster_external_upstream_rq{envoy_cluster_name='default/cilium-gateway-epf-gateway/default_nginx_80'}[1m])) or vector(0)"
        threshold: '100'