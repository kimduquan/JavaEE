initContainers:
  resources:
    limits: {}
    requests:
      cpu: 100m
      memory: 128Mi

## @section Gitea
#
gitea:
  ## @param gitea.metrics.enabled Enable Gitea metrics.
  ## @param gitea.metrics.token used for `bearer` token authentication on metrics endpoint. If not specified or empty metrics endpoint is public.
  ## @param gitea.metrics.serviceMonitor.enabled Enable Gitea metrics service monitor. Requires, that `gitea.metrics.enabled` is also set to true, to enable metrics generally.
  ## @param gitea.metrics.serviceMonitor.interval Interval at which metrics should be scraped. If not specified Prometheus' global scrape interval is used.
  ## @param gitea.metrics.serviceMonitor.relabelings RelabelConfigs to apply to samples before scraping.
  ## @param gitea.metrics.serviceMonitor.scheme HTTP scheme to use for scraping. For example `http` or `https`. Default is http.
  ## @param gitea.metrics.serviceMonitor.scrapeTimeout Timeout after which the scrape is ended. If not specified, global Prometheus scrape timeout is used.
  ## @param gitea.metrics.serviceMonitor.tlsConfig TLS configuration to use when scraping the metric endpoint by Prometheus.
  metrics:
    enabled: false
    token:
    serviceMonitor:
      enabled: false
      #  additionalLabels:
      #    prometheus-release: prom1
      interval: ""
      relabelings: []
      scheme: ""
      scrapeTimeout: ""
      tlsConfig: {}

  ## @param gitea.ldap LDAP configuration.
  ldap: []
    # - name: "LDAP 1"
    #  existingSecret:
    #  securityProtocol:
    #  host:
    #  port:
    #  userSearchBase:
    #  userFilter:
    #  adminFilter:
    #  emailAttribute:
    #  bindDn:
    #  bindPassword:
    #  usernameAttribute:
    #  publicSSHKeyAttribute:

  # Either specify inline `key` and `secret` or refer to them via `existingSecret`
  ## @param gitea.oauth OAuth configuration.
  oauth:
    - name: 'KDQ'
      provider: "openidConnect"
    #   key:
    #   secret:
      existingSecret:
      autoDiscoverUrl:
    #   useCustomUrls:
    #   customAuthUrl:
    #   customTokenUrl:
    #   customProfileUrl:
    #   customEmailUrl:

  ## @param gitea.config.server.SSH_PORT SSH port for rootlful Gitea image.
  ## @param gitea.config.server.SSH_LISTEN_PORT SSH port for rootless Gitea image.
  config:
    APP_NAME: "KDQ Git"
    #  RUN_MODE: dev
    server:
      SSH_PORT: 22 # rootful image
      SSH_LISTEN_PORT: 22 # rootless image
      ROOT_URL: "https://touching-pika-enabled.ngrok-free.app"
    database:
      DB_TYPE: postgres
      HOST: supavisor:5432
      NAME: gitea
    session:
      PROVIDER: redis
      PROVIDER_CONFIG: "redis://:090323508@redis-master:6379/0"
    cache:
      ADAPTER: redis
      HOST: "redis://:090323508@redis-master:6379/0?pool_size=100&idle_timeout=180s"
    queue:
      TYPE: redis
      CONN_STR: "redis://:090323508@redis-master:6379/0"
    admin:
      DISABLE_REGULAR_ORG_CREATION: true
    service:
      REQUIRE_SIGNIN_VIEW: true
      ENABLE_NOTIFY_MAIL: true
      ENABLE_BASIC_AUTHENTICATION: false
      ENABLE_PASSWORD_SIGNIN_FORM: false
      ENABLE_PASSKEY_AUTHENTICATION: false
      ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      explore:
        REQUIRE_SIGNIN_VIEW: true
        DISABLE_USERS_PAGE: true
        DISABLE_ORGANIZATIONS_PAGE: true
    mailer:
      ENABLED: true
      SMTP_ADDR: "smtp.gmail.com"
      SMTP_PORT: 587
      USER: "kimduquan@gmail.com"
      FROM: "kimduquan@gmail.com"
  #
  #  security:
  #    PASSWORD_COMPLEXITY: spec

  ## @param gitea.additionalConfigSources Additional configuration from secret or configmap.
  additionalConfigSources: []
  #   - secret:
  #       secretName: gitea-secret
  #   - configMap:
  #       name: gitea-app-ini-plaintext

  ## @param gitea.additionalConfigFromEnvs Additional configuration sources from environment variables.
  additionalConfigFromEnvs:
    - name: GITEA__DATABASE__USER
      valueFrom:
        secretKeyRef:
          name: gitea-secret
          key: database_user
    - name: GITEA__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-secret
          key: database_passwd
    - name: GITEA__MAILER__PASSWD
      valueFrom:
        secretKeyRef:
          name: smtp
          key: smtp-password

  ## @param gitea.extraEnvSourceFile Source environment variables from a file during init container startup. This is especially useful for reading environment variable files generated by the Vault agent-injector.
  ## See the sample annotations below for reference.
  ## podAnnotations:
  ##   vault.hashicorp.com/agent-inject: "true"
  ##   vault.hashicorp.com/agent-init-first: "true"
  ##   vault.hashicorp.com/agent-inject-secret-gitea: <path/to/secret>
  ##   vault.hashicorp.com/agent-inject-template-gitea: |
  ##     {{- with secret "path/to/secret" -}}
  ##     export GITEA__database__HOST="{{ .Data.data.db_host }}"
  ##     export GITEA__database__NAME="{{ .Data.data.db_name }}"
  ##     export GITEA__database__USER="{{ .Data.data.db_user }}"
  ##     export GITEA__database__PASSWD="{{ .Data.data.db_password }}"
  ##     export GITEA__queue__CONN_STR="{{ .Data.data.kv_conn_string }}"
  ##     export GITEA__session__PROVIDER_CONFIG="{{ .Data.data.kv_conn_string }}"
  ##     export GITEA__cache__HOST="{{ .Data.data.kv_conn_string }}"
  ##     export GITEA_ADMIN_USERNAME="{{ .Data.data.gitea_admin_user }}"
  ##     export GITEA_ADMIN_PASSWORD="{{ .Data.data.gitea_admin_password }}"
  ##     {{- end }}

  # extraEnvSourceFile: /vault/secrets/gitea
  extraEnvSourceFile:

  ## @param gitea.podAnnotations Annotations for the Gitea pod.
  podAnnotations: {}

  ## @param gitea.ssh.logLevel Configure OpenSSH's log level. Only available for root-based Gitea image.
  ssh:
    logLevel: "INFO"

  ## @section LivenessProbe
  #
  ## @param gitea.livenessProbe.enabled Enable liveness probe.
  ## @param gitea.livenessProbe.tcpSocket.port Port to probe for liveness.
  ## @param gitea.livenessProbe.initialDelaySeconds Initial delay before liveness probe is initiated.
  ## @param gitea.livenessProbe.timeoutSeconds Timeout for liveness probe.
  ## @param gitea.livenessProbe.periodSeconds Period for liveness probe.
  ## @param gitea.livenessProbe.successThreshold Success threshold for liveness probe.
  ## @param gitea.livenessProbe.failureThreshold Failure threshold for liveness probe.
  # Modify the liveness probe for your needs or completely disable it by commenting out.
  livenessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 200
    timeoutSeconds: 1
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 10

  ## @section ReadinessProbe
  #
  ## @param gitea.readinessProbe.enabled Enable readiness probe.
  ## @param gitea.readinessProbe.tcpSocket.port Port to probe for readiness.
  ## @param gitea.readinessProbe.initialDelaySeconds Initial delay before readiness probe is initiated.
  ## @param gitea.readinessProbe.timeoutSeconds Timeout for readiness probe.
  ## @param gitea.readinessProbe.periodSeconds Period for readiness probe.
  ## @param gitea.readinessProbe.successThreshold Success threshold for readiness probe.
  ## @param gitea.readinessProbe.failureThreshold Failure threshold for readiness probe.
  # Modify the readiness probe for your needs or completely disable it by commenting out.
  readinessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    timeoutSeconds: 1
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3

  # # Uncomment the startup probe to enable and modify it for your needs.
  ## @section StartupProbe
  #
  ## @param gitea.startupProbe.enabled Enable startup probe.
  ## @param gitea.startupProbe.tcpSocket.port Port to probe for startup.
  ## @param gitea.startupProbe.initialDelaySeconds Initial delay before startup probe is initiated.
  ## @param gitea.startupProbe.timeoutSeconds Timeout for startup probe.
  ## @param gitea.startupProbe.periodSeconds Period for startup probe.
  ## @param gitea.startupProbe.successThreshold Success threshold for startup probe.
  ## @param gitea.startupProbe.failureThreshold Failure threshold for startup probe.
  startupProbe:
    enabled: false
    tcpSocket:
      port: http
    initialDelaySeconds: 60
    timeoutSeconds: 1
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 10

## @section CloudNativePG
# The CloudNativePG operator itself is not part of this chart. It must be installed cluster-wide beforehand:
# https://cloudnative-pg.io/documentation/current/installation_upgrade/
cloudnativePG:
  ## @param cloudnativePG.enabled Provision a CloudNativePG `Cluster` for Gitea. Requires the CloudNativePG operator to be installed in the cluster.
  enabled: false

  ## @param cloudnativePG.annotations Annotations for the CloudNativePG `Cluster`.
  ## @param cloudnativePG.labels Additional labels for the CloudNativePG `Cluster`.
  annotations: {}
  labels: {}

  ## @param cloudnativePG.image.registry Image registry.
  ## @param cloudnativePG.image.repository Image repository.
  ## @param cloudnativePG.image.tag Image tag.
  image:
    registry: ghcr.io
    repository: cloudnative-pg/postgresql
    tag: "18.0"

  ## @param cloudnativePG.instances Number of PostgreSQL instances. Values greater than `1` provision a HA-ready cluster with streaming replication.
  instances: 1

  credentials:
    ## @param cloudnativePG.credentials.addSHASumAnnotation Add a pod annotation with the SHA sum of the credentials Secret to trigger a rollout on change. Further information can be found in the [documentation](./README.md#secret-checksum-annotation).
    addSHASumAnnotation: false

    ## @param cloudnativePG.credentials.database Name of the database to create. CloudNativePG requires it as a literal in the `Cluster`, hence it cannot be sourced from a Secret.
    ## @param cloudnativePG.credentials.username Name of the database owner to create. CloudNativePG requires it as a literal in the `Cluster`, hence it cannot be sourced from a Secret.
    database: gitea
    username: gitea

    ## @param cloudnativePG.credentials.existingSecret.enabled Use an already existing Secret instead of creating the credentials Secret.
    ## @param cloudnativePG.credentials.existingSecret.secretName Name of the already existing credentials Secret. Must be of type `kubernetes.io/basic-auth` and its `username` must match `cloudnativePG.credentials.username`.
    ## @param cloudnativePG.credentials.existingSecret.passwordKey Key of the password in the existing credentials Secret.
    existingSecret:
      enabled: false
      secretName: ""
      passwordKey: password

    ## @param cloudnativePG.credentials.new.annotations Annotations for the credentials Secret.
    ## @param cloudnativePG.credentials.new.labels Labels for the credentials Secret.
    ## @param cloudnativePG.credentials.new.password Password of the database owner.
    new:
      annotations: {}
      labels: {}
      password: gitea

  ## @param cloudnativePG.postgresql.parameters Custom PostgreSQL configuration parameters.
  postgresql:
    parameters: {}

  ## @param cloudnativePG.storage.size Size of the data volume.
  ## @param cloudnativePG.storage.storageClass Storage class of the data volume. Defaults to the cluster's default storage class.
  storage:
    size: 1Gi
    storageClass: ""

  ## @param cloudnativePG.walStorage.enabled Store the write-ahead log on a dedicated volume.
  ## @param cloudnativePG.walStorage.size Size of the write-ahead log volume.
  ## @param cloudnativePG.walStorage.storageClass Storage class of the write-ahead log volume. Defaults to the cluster's default storage class.
  walStorage:
    enabled: false
    size: 1Gi
    storageClass: ""

  ## @param cloudnativePG.affinity Affinity for the PostgreSQL pods. CloudNativePG nests `nodeSelector` and `tolerations` below this key as well.
  affinity: {}

  ## @param cloudnativePG.priorityClassName Priority class name for the PostgreSQL pods.
  priorityClassName: ""

  ## @param cloudnativePG.monitoring.enablePodMonitor Create a `PodMonitor` for the CloudNativePG `Cluster`.
  monitoring:
    enablePodMonitor: false

  ## @param cloudnativePG.resources Kubernetes resources for the PostgreSQL containers.
  resources: {}

  ## @param cloudnativePG.topologySpreadConstraints Topology spread constraints for the PostgreSQL pods.
  topologySpreadConstraints: []


## @section valkey
valkey:
  ## @param valkey.enabled Enable valkey standalone or replicated.
  enabled: false

  ## @param valkey.image.registry Image registry.
  ## @param valkey.image.repository Image repository.
  ## @param valkey.image.tag Image tag.
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: ""

  ## @param valkey.auth.enabled Enable ACL-based authentication.
  ## @param valkey.auth.aclUsers.default.permissions ACL permissions for the default user.
  ## @param valkey.auth.aclUsers.default.password Password for the default user.
  auth:
    enabled: true
    aclUsers:
      default:
        permissions: "~* &* +@all"
        password: changeme

  ## @param valkey.service.port Port of Valkey service.
  service:
    port: 6379

  ## @param valkey.dataStorage.enabled Enable persistence using Persistent Volume Claims.
  ## @param valkey.dataStorage.className Persistent Volume storage class.
  ## @param valkey.dataStorage.requestedSize Persistent Volume size.
  dataStorage:
    enabled: false
    className: ""
    requestedSize: 1Gi

  ## @param valkey.replica.enabled Enable replication.
  ## @param valkey.replica.replicas Number of Valkey replica instances to deploy.
  ## @param valkey.replica.persistence.size Persistent Volume size for replicas.
  ## @param valkey.replica.persistence.storageClass Persistent Volume storage class for replicas.
  replica:
    enabled: false
    replicas: 1
    persistence:
      size: 1Gi
      storageClass: ""

  ## @param valkey.metrics.enabled Enable Prometheus exporter sidecar.
  ## @param valkey.metrics.exporter.image.registry Image registry.
  ## @param valkey.metrics.exporter.image.repository Image repository.
  ## @param valkey.metrics.exporter.image.tag Image tag.
  metrics:
    enabled: false
    exporter:
      image:
        registry: ghcr.io
        repository: oliver006/redis_exporter
        tag: ""


