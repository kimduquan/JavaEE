apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-proxy
  namespace: default
  annotations:
    haproxy.org/server-ssl: "true"
    haproxy.org/ssl-redirect: "false"

spec:
  ingressClassName: "haproxy"
  rules:
    - host: chipmunk-capable-prawn.ngrok-free.app
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 443
