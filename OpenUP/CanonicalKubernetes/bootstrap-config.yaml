cluster-config:
  network:
    enabled: false
  dns:
    enabled: true
    cluster-domain: cluster.local
  ingress:
    enabled: false
  load-balancer:
    enabled: true
    cidrs:
      - 192.168.1.220-192.168.1.234
    l2-mode: true
    l2-interfaces:
      - eth0
  local-storage:
    enabled: true
    default: true
  gateway:
    enabled: true
  metrics-server:
    enabled: true
control-plane-taints: []
etcd-port: 2390
etcd-peer-port: 2391
datastore-type: etcd