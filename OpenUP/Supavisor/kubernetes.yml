---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: supavisor-tls
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: supavisor-tls
  namespace: default
spec:
  ca:
    secretName: supavisor-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: supavisor-tls
  namespace: default
spec:
  isCA: true
  commonName: supavisor
  dnsNames:
    - "supavisor.default.svc.cluster.local"
    - "supavisor"
  secretName: supavisor-tls
  issuerRef:
    name: supavisor-tls
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: v1
kind: Service
metadata:
  annotations:
  labels:
    app.kubernetes.io/name: supavisor
    app.kubernetes.io/version: 1.0.0
  name: supavisor
spec:
  ports:
    - name: api
      port: 4000
      protocol: TCP
      targetPort: 4000
    - name: session
      port: 5452
      protocol: TCP
      targetPort: 5452
    - name: transaction
      port: 6543
      protocol: TCP
      targetPort: 6543
  selector:
    app.kubernetes.io/name: supavisor
    app.kubernetes.io/version: 1.0.0
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  labels:
    app.kubernetes.io/name: supavisor
    app.kubernetes.io/version: 1.0.0
  name: supavisor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: supavisor
      app.kubernetes.io/version: 1.0.0
  template:
    metadata:
      annotations:
      labels:
        app.kubernetes.io/name: supavisor
        app.kubernetes.io/version: 1.0.0
    spec:
      containers:
        - env:
            - name: PORT
              value: "4000"
            - name: PROXY_PORT_SESSION
              value: "5452"
            - name: PROXY_PORT_TRANSACTION
              value: "6543"
            - name: DATABASE_URL
              value: "ecto://postgres:090323508@postgresql-primary:5432/postgres"
            - name: CLUSTER_POSTGRES
              value: "false"
            - name: GLOBAL_DOWNSTREAM_CERT_PATH
              value: "/supavisor-tls/tls.crt"
            - name: GLOBAL_DOWNSTREAM_KEY_PATH
              value: "/supavisor-tls/tls.key"
            - name: NAMED_PREPARED_STATEMENTS_ENABLED
              value: "true"
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: supavisor
                  key: SECRET_KEY_BASE
            - name: VAULT_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: supavisor
                  key: VAULT_ENC_KEY
            - name: API_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: supavisor
                  key: API_JWT_SECRET
            - name: METRICS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: supavisor
                  key: METRICS_JWT_SECRET
            - name: REGION
              value: "local"
            - name: ERL_AFLAGS
              value: -proto_dist inet_tcp
          image: supabase/supavisor:2.7.4
          imagePullPolicy: IfNotPresent
          name: supavisor
          command: ["/bin/sh", "-c", "/app/bin/migrate && /app/bin/server"]
          ports:
            - containerPort: 4000
              name: api
              protocol: TCP
            - containerPort: 5452
              name: session
              protocol: TCP
            - containerPort: 6543
              name: transaction
              protocol: TCP
          resources:
            limits:
              cpu: 375m
              memory: 384Mi
            requests:
              cpu: 25m
              memory: 128Mi
          volumeMounts:
            - mountPath: /supavisor-tls
              name: supavisor-tls
              readOnly: true
          readinessProbe:
            initialDelaySeconds: 120
            tcpSocket:
              port: 4000
          startupProbe:
            initialDelaySeconds: 120
            tcpSocket:
              port: 4000
          livenessProbe:
            initialDelaySeconds: 120
            tcpSocket:
              port: 6543
      volumes:
        - name: supavisor-tls
          secret:
            secretName: supavisor-tls
