apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
spec:
  config:
    featureGates:
    - HonorWaitForFirstConsumer
    podResourceRequirements:
      requests:
        cpu: "10m"
  imagePullPolicy: IfNotPresent
  infra:
    apiServerReplicas: 1
    deploymentReplicas: 1
    nodeSelector:
      kubernetes.io/os: linux
    uploadProxyReplicas: 0
  workload:
    nodeSelector:
      kubernetes.io/os: linux
